name: auto-test-service

services:
    auto-test-service:
        build: .
        image: auto-test-service:uat
        container_name: auto-test-service
        env_file:
            - .env
        environment:
            - "PORT=3000"
            - "TZ=Asia/Bangkok"
        ports:
            - "3081:3000"
        restart: always
        stop_grace_period: 35s
        networks:
            - kpat_network

networks:
    kpat_network:
        external: true
        name: kpat_network
